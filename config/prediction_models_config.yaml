# Parametry aktywnych modeli używanych w ocenie rolling-origin.
global_training:
  seed: 42

xgboost:
  lags: 10
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  n_jobs: 1  # Jeden wątek na fit; równoległość zapewnia 20 procesów rolling-origin

sarimax:
  # SARIMAX z zerowym składnikiem sezonowym jest modelem ARIMA(1,1,1).
  order: [1, 1, 1]
  seasonal_order: [0, 0, 0, 0]

prophet:
  # Calendar seasonalities are disabled because datasets use different sample intervals.
  yearly_seasonality: false
  weekly_seasonality: false
  daily_seasonality: false
  n_changepoints: 5
  changepoint_prior_scale: 0.05
  seasonality_mode: additive
  seasonal_fourier_order: 5
  max_points: 2000

holt_winters:
  trend: add
  seasonal: add
  damped_trend: false
  # Keep recent complete cycles; seasonal periods come from config/config.yaml.
  max_seasonal_cycles: 4
  initialization_method: heuristic
