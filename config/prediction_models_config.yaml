# Parametry jedynych aktywnych modeli używanych w ocenie rolling-origin:
# prostego XGBoost oraz niesezonowego ARIMA.
global_training:
  seed: 42

xgboost:
  lags: 10
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  n_jobs: 1  # Jeden wątek na fit; równoległość zapewnia 20 procesów rolling-origin

sarimax:
  # SARIMAX z zerowym składnikiem sezonowym jest modelem ARIMA(1,1,1).
  order: [1, 1, 1]
  seasonal_order: [0, 0, 0, 0]
